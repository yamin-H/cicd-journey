name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - feature/**
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter
        run: flake8 app.py

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test_app.py -v

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify build
        run: python -c "import app; print('Build OK')"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to STAGING..."
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Staging deployment triggered."
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to PRODUCTION..."
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Production deployment triggered."
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"